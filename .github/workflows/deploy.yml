name: Update regimes and publish

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # a newer run replaces a queued or stuck one, so one stuck 'waiting' deploy
  # can no longer freeze the site (as happened on 6 Oct 2026)
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Last good price download, used only if Yahoo Finance is unreachable on this run
      - name: Reuse price cache
        uses: actions/cache@v4
        with:
          path: out/prices.csv
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      # Re-filters with the saved calibration in model/hmm_params.json (refit yearly by refit.yml)
      - run: python hmm_regime.py
      # Display-only market signals (credit stress, VIX curve, small caps); never blocks the update
      - name: Reuse market-signal downloads
        uses: actions/cache@v4
        with:
          path: out/context_cache
          key: context-${{ github.run_id }}
          restore-keys: context-
      - run: python context_data.py
        continue-on-error: true
      - run: python build_dashboard.py --site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
