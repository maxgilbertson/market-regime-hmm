name: Yearly recalibration

# On 2 January: record last year's moods as they were called, then refit the model on all data
# to 31 December. The new calibration is kept only if every label check passes (hmm_regime.py
# --refit exits 2 otherwise); a rejected refit keeps the old one and opens an issue.
on:
  schedule:
    - cron: "0 7 2 1 *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refit
  cancel-in-progress: false

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record last year's moods as called
        run: |
          python hmm_regime.py
          python hmm_regime.py --append-wf $(( $(date -u +%Y) - 1 ))
      - name: Refit on all data to 31 December
        id: refit
        continue-on-error: true
        run: python hmm_regime.py --refit --train-end $(( $(date -u +%Y) - 1 ))-12-31
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/
          git commit -m "Yearly recalibration: data to $(( $(date -u +%Y) - 1 ))-12-31 (${{ steps.refit.outcome }})" || exit 0
          git pull --rebase
          git push
      - name: Open an issue if the refit was rejected
        if: steps.refit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Yearly refit rejected" --body "The new calibration failed a check and was not used. Details in model/refit_status.json."
